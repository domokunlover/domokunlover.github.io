<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>404</title>

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/assets/css/themes.css">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/not_found.css">

  <link rel="shortcut icon" href="/assets/graphics/favicons/cobweb.png" type="image/x-icon">

  <script src="/assets/js/loader/loader.js"></script>
</head>

<body id="top">

<div id="loadingScreen">Loading</div>
<noscript>
  <style>
    #loadingScreen {
      display: none;
    }

    body {
      overflow-y: auto;
    }
  </style>
</noscript>


<main class="not-found">

  <div class="not-found-window">

    <div class="not-found-header">
      <span>ERROR // 404</span>
      <span>●</span>
    </div>

    <div class="not-found-body">

      <div class="not-found-code">
        404
      </div>

      <div class="not-found-content">

        <p class="not-found-eyebrow">
          page not found
        </p>

        <h1>
          @#$%&#@%<span class="cursor">_</span>
        </h1>

        <p class="not-found-message">
          the page you're looking for doesn't seem to exist here.
          it may have been moved, deleted, or perhaps it never existed
          in the first place.
        </p>

        <div class="not-found-actions">
          <a href="/home.html" class="not-found-link" onmouseover="mechanical.playclip()" onclick="flashlight.playclip()">
            &gt; return home
          </a>

          <a href="javascript:history.back()" class="not-found-link" onmouseover="mechanical.playclip()" onclick="flashlight.playclip()">
            &lt; return to previous page
          </a>
        </div>

      </div>

    </div>

    <div class="not-found-footer">
      <span>STATUS: 404</span>
      <span>REQUEST FAILED</span>
    </div>

  </div>

</main>


<script src="/script.js"></script>
<script src="/assets/js/sound-effects/effects.js"></script>
<script src="/assets/js/theme-switcher/switcher.js"></script>
</body>
</html>
